# NAME: Douyin + Bilibili Direct
# AUTHOR: Orchidroot
# REPO: https://github.com/Orchidroot/douyin-web-accelerator
#
# Minimal Shadowrocket configuration for users without an existing config.
# It contains no proxy server or subscription. All traffic remains DIRECT.

[General]
dns-server = system
fallback-dns-server = system
ipv6 = true
prefer-ipv6 = false
private-ip-answer = true

[Rule]
RULE-SET,https://raw.githubusercontent.com/Orchidroot/douyin-web-accelerator/main/rules/shadowrocket-douyin-bilibili.list,DIRECT
FINAL,DIRECT
